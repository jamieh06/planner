<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a5c"/>
      <stop offset=".55" stop-color="#1a4fc6"/>
      <stop offset="1" stop-color="#3b7fe2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="glow" cx=".8" cy=".15" r=".7">
      <stop offset="0" stop-color="#8fc3ec" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8fc3ec" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="96" y="112" width="320" height="296" rx="56"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- glass calendar page, same card as the To Do icon -->
  <rect x="96" y="112" width="320" height="296" rx="56" fill="url(#glass)"/>
  <rect x="96" y="112" width="320" height="76" fill="#ffffff" fill-opacity=".22" clip-path="url(#card)"/>
  <rect x="96" y="112" width="320" height="296" rx="56" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="3"/>
  <!-- binder rings -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="16">
    <path d="M184 92v44"/>
    <path d="M328 92v44"/>
  </g>
  <!-- days: 4 x 3 grid, today ringed -->
  <g fill="#ffffff" fill-opacity=".7">
    <circle cx="164" cy="240" r="13"/><circle cx="224" cy="240" r="13"/><circle cx="288" cy="240" r="13"/><circle cx="348" cy="240" r="13"/>
    <circle cx="164" cy="296" r="13"/><circle cx="224" cy="296" r="13"/><circle cx="348" cy="296" r="13"/>
    <circle cx="164" cy="352" r="13"/><circle cx="224" cy="352" r="13"/><circle cx="288" cy="352" r="13"/>
  </g>
  <circle cx="288" cy="296" r="17" fill="#ffffff"/>
  <circle cx="288" cy="296" r="30" fill="none" stroke="#ffffff" stroke-width="7"/>
</svg>
